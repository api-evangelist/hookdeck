openapi: 3.2.0
info:
  title: Hookdeck Attempts API
  version: '1.0'
  description: 'Operations tagged Attempts across 2 of this provider''s published API definitions: hookdeck-openapi.yml, hookdeck-attempts-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.outpost.hookdeck.com/2025-07-01
  description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
- url: http://localhost:3333/api/v1
  description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
- url: https://api.hookdeck.com/2025-07-01
  description: Production API
tags:
- name: Attempts
  description: 'Attempts represent individual delivery attempts of events to destinations. The attempts API provides an attempt-centric view of event processing.


    Use the `include` query parameter to include related data:

    - `include=event`: Include event summary (id, topic, time, eligible_for_retry, metadata)

    - `include=event.data`: Include full event with payload data

    - `include=response_data`: Include response body and headers from the attempt

    - `include=destination`: Include the destination object with target information, without credentials'
paths:
  /attempts:
    get:
      tags:
      - Attempts
      summary: List Attempts
      description: 'Retrieves a paginated list of attempts.


        When authenticated with a Tenant JWT, returns only attempts belonging to that tenant.

        When authenticated with Admin API Key, returns attempts across all tenants. Use `tenant_id` query parameter to filter by tenant.'
      operationId: listAttempts
      security:
      - AdminApiKey: []
      - TenantJwt: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: 'Filter attempts by tenant ID(s). Use bracket notation for multiple values (e.g., `tenant_id[0]=t1&tenant_id[1]=t2`).

          When authenticated with a Tenant JWT, this parameter is ignored and the JWT''s tenant is used.

          If not provided with API key auth, returns attempts from all tenants.

          '
      - name: event_id
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter attempts by event ID(s). Use bracket notation for multiple values (e.g., `event_id[0]=e1&event_id[1]=e2`).
      - name: destination_id
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter attempts by destination ID(s). Use bracket notation for multiple values (e.g., `destination_id[0]=d1&destination_id[1]=d2`).
      - name: destination_type
        in: query
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/DestinationType'
          - type: array
            items:
              $ref: '#/components/schemas/DestinationType'
        description: Filter attempts by destination type(s). Use bracket notation for multiple values (e.g., `destination_type[0]=webhook&destination_type[1]=aws_sqs`).
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - success
          - failed
        description: Filter attempts by status.
      - name: topic
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter attempts by event topic(s). Use bracket notation for multiple values (e.g., `topic[0]=user.created&topic[1]=user.updated`).
      - name: time
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/Operator'
        description: Filter attempts by event time range using comparison operators.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
        description: Number of items per page (1-1000, default 100). A value outside this range, or one that is not an integer, returns a 400.
      - name: next
        in: query
        required: false
        schema:
          type: string
        description: Cursor for the next page of results, from `pagination.next` of a previous response. Mutually exclusive with `prev`. A cursor that cannot be read returns a 400.
      - name: prev
        in: query
        required: false
        schema:
          type: string
        description: Cursor for the previous page of results, from `pagination.prev` of a previous response. Mutually exclusive with `next`. A cursor that cannot be read returns a 400.
      - name: include
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: 'Fields to include in the response. Use bracket notation for multiple values (e.g., `include[0]=event&include[1]=response_data`).

          - `event`: Include event summary (id, topic, time, eligible_for_retry, metadata)

          - `event.data`: Include full event with payload data

          - `response_data`: Include response body and headers

          - `destination`: Include the destination object, without credentials

          '
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - time
          default: time
        description: Field to sort by.
      - name: dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction.
      responses:
        '200':
          description: A paginated list of attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPaginatedResult'
              examples:
                AdminAttemptsListExample:
                  value:
                    pagination:
                      order_by: time
                      dir: desc
                      limit: 100
                      next: MTcwNDA2NzIwMA==
                      prev: null
                    models:
                    - id: atm_123
                      status: success
                      time: '2024-01-01T00:00:05Z'
                      code: '200'
                      attempt_number: 1
                      latency_ms: 212
                      event_id: evt_123
                      destination_id: des_456
                    - id: att_124
                      status: failed
                      time: '2024-01-02T10:00:01Z'
                      code: '503'
                      attempt_number: 2
                      latency_ms: 1502
                      event_id: evt_789
                      destination_id: des_789
                AdminAttemptsWithIncludeExample:
                  summary: Response with include=event
                  value:
                    pagination:
                      order_by: time
                      dir: desc
                      limit: 100
                      next: null
                      prev: null
                    models:
                    - id: del_123
                      status: success
                      time: '2024-01-01T00:00:05Z'
                      code: '200'
                      attempt_number: 1
                      latency_ms: 212
                      event_id: evt_123
                      destination_id: des_456
                      event:
                        id: evt_123
                        topic: user.created
                        time: '2024-01-01T00:00:00Z'
                        eligible_for_retry: false
                        metadata:
                          source: crm
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /attempts/{attempt_id}:
    parameters:
    - name: attempt_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the attempt.
    get:
      tags:
      - Attempts
      summary: Get Attempt
      description: 'Retrieves details for a specific attempt.


        When authenticated with a Tenant JWT, only attempts belonging to that tenant can be accessed.

        When authenticated with Admin API Key, attempts from any tenant can be accessed.'
      operationId: getAttempt
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by tenant ID. Returns 404 if the attempt does not belong to the specified tenant. Ignored when using Tenant JWT authentication.
      - name: include
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: 'Fields to include in the response. Use bracket notation for multiple values (e.g., `include[0]=event&include[1]=response_data`).

          - `event`: Include event summary (id, topic, time, eligible_for_retry, metadata)

          - `event.data`: Include full event with payload data

          - `response_data`: Include response body and headers

          - `destination`: Include the destination object, without credentials

          '
      responses:
        '200':
          description: Attempt details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
              examples:
                AttemptExample:
                  value:
                    id: atm_123
                    status: success
                    time: '2024-01-01T00:00:05Z'
                    code: '200'
                    attempt_number: 1
                    latency_ms: 212
                    event_id: evt_123
                    destination_id: des_456
                AttemptWithIncludeExample:
                  summary: Response with include=event.data,response_data
                  value:
                    id: atm_123
                    status: success
                    time: '2024-01-01T00:00:05Z'
                    code: '200'
                    response_data:
                      status_code: 200
                      body: '{"status":"ok"}'
                      headers:
                        content-type: application/json
                    attempt_number: 1
                    latency_ms: 212
                    event_id: evt_123
                    destination_id: des_456
                    event:
                      id: evt_123
                      topic: user.created
                      time: '2024-01-01T00:00:00Z'
                      eligible_for_retry: false
                      metadata:
                        source: crm
                      data:
                        user_id: userid
                        status: active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /attempts/{id}:
    get:
      operationId: getAttemptsById
      summary: Retrieve an attempt
      description: This endpoint retrieves a specific attempt. When retrieving a completed attempt, the response will contain the `body` of the destination's response. If the `body` is not yet available in our backend service the `body` will be set to `NOT_AVAILABLE_YET`.
      tags:
      - Attempts
      responses:
        '200':
          description: A single attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAttempt'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse_2'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: Attempt ID
        required: true
      security:
      - bearerAuth: []
      - basicAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: getAttempt
    servers:
    - url: https://api.hookdeck.com/2025-07-01
      description: Production API
components:
  schemas:
    Topics:
      oneOf:
      - type: string
        enum:
        - '*'
      - type: array
        items:
          type: string
      description: '"*" or an array of enabled topics. Topic strings can include "*" as a wildcard matching any run of characters. When available topics are configured, wildcard patterns must match at least one available topic.'
      example: '*'
    APIErrorResponse:
      type: object
      description: Standard error response format.
      properties:
        status:
          type: integer
          description: HTTP status code.
          example: 422
        message:
          type: string
          description: Human-readable error message.
          example: validation error
        data:
          description: Additional error details. For validation errors, this is an array of human-readable messages.
          oneOf:
          - type: array
            items:
              type: string
            description: Array of validation error messages.
            example:
            - email is required
            - password must be at least 6 characters
          - type: object
            additionalProperties: true
            description: Additional contextual data about the error.
    SeekPagination:
      type: object
      description: Cursor-based pagination metadata for list responses.
      properties:
        order_by:
          type: string
          description: The field being sorted on.
          example: created_at
        dir:
          type: string
          enum:
          - asc
          - desc
          description: Sort direction.
          example: desc
        limit:
          type: integer
          description: Page size limit.
          example: 100
        next:
          type: string
          nullable: true
          description: Cursor for the next page of results. Null if no more results.
          example: MTcwNDA2NzIwMA==
        prev:
          type: string
          nullable: true
          description: Cursor for the previous page of results. Null if on first page.
          example: null
    AttemptDestination:
      type: object
      description: The destination an attempt was sent to, without credentials. Use the destination endpoints to retrieve credentials.
      required:
      - id
      - tenant_id
      - type
      - topics
      - config
      - created_at
      - updated_at
      - disabled_at
      - target
      properties:
        id:
          type: string
          description: Control plane generated ID or user provided ID for the destination.
          example: des_12345
        tenant_id:
          type: string
          description: The tenant the destination belongs to.
          example: tenant_123
        type:
          type: string
          description: Type of the destination.
          example: webhook
        topics:
          $ref: '#/components/schemas/Topics'
        filter:
          $ref: '#/components/schemas/Filter'
        config:
          type: object
          additionalProperties:
            type: string
          description: Type-specific destination configuration.
          example:
            url: https://my-service.com/webhook/handler
        delivery_metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Static key-value pairs merged into event metadata on every attempt.
          example:
            app-id: my-app
            region: us-east-1
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary contextual information stored with the destination.
          example:
            internal-id: '123'
            team: platform
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: ISO Date when the destination was disabled, or null if enabled.
          example: null
        created_at:
          type: string
          format: date-time
          description: ISO Date when the destination was created.
          example: '2024-01-01T00:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO Date when the destination was last updated.
          example: '2024-01-01T00:00:00Z'
        target:
          type: string
          description: A human-readable representation of the destination target (e.g., URL host). Read-only.
          readOnly: true
          example: my-service.com
        target_url:
          type: string
          format: url
          nullable: true
          description: A URL link to the destination target. Read-only.
          readOnly: true
          example: https://my-service.com/webhook/handler
    Operator:
      type: object
      description: Comparison operators for filtering by date-time values (RFC3339 or YYYY-MM-DD format).
      properties:
        gte:
          type: string
          format: date-time
          description: Filter with value >= the specified date-time.
        lte:
          type: string
          format: date-time
          description: Filter with value <= the specified date-time.
        gt:
          type: string
          format: date-time
          description: Filter with value > the specified date-time.
        lt:
          type: string
          format: date-time
          description: Filter with value < the specified date-time.
    EventFull:
      type: object
      description: Full event object with data (returned when include=event.data).
      properties:
        id:
          type: string
          example: evt_123
        tenant_id:
          type: string
          description: The tenant this event belongs to.
          example: tnt_123
        destination_id:
          type: string
          description: The destination this event was delivered to.
          example: des_456
        topic:
          type: string
          example: user.created
        time:
          type: string
          format: date-time
          description: Time the event was received.
          example: '2024-01-01T00:00:00Z'
        eligible_for_retry:
          type: boolean
          description: Whether this event can be retried.
          example: true
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          example:
            source: crm
        data:
          type: object
          additionalProperties: true
          description: The event payload data.
          example:
            user_id: userid
            status: active
    EventSummary:
      type: object
      description: Event object without data (returned when include=event).
      properties:
        id:
          type: string
          example: evt_123
        tenant_id:
          type: string
          description: The tenant this event belongs to.
          example: tnt_123
        destination_id:
          type: string
          description: The destination this event was delivered to.
          example: des_456
        topic:
          type: string
          example: user.created
        time:
          type: string
          format: date-time
          description: Time the event was received.
          example: '2024-01-01T00:00:00Z'
        eligible_for_retry:
          type: boolean
          description: Whether this event can be retried.
          example: true
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          example:
            source: crm
    DestinationType:
      type: string
      enum:
      - webhook
      - aws_sqs
      - rabbitmq
      - hookdeck
      - aws_kinesis
      - azure_servicebus
      - aws_s3
      - gcp_pubsub
      - kafka
      - cloudflare_queues
      - aws_eventbridge
      description: Type of destination.
      example: webhook
    Filter:
      type: object
      nullable: true
      additionalProperties: true
      description: 'Optional JSON schema filter for event matching. Events must match this filter to be delivered to this destination.

        Supports operators: $eq, $neq, $gt, $gte, $lt, $lte, $in, $nin, $startsWith, $endsWith, $exist, $or, $and, $not.

        If null or empty, all events matching the topic filter will be delivered.

        Uses full-replacement semantics on update: send a new object to replace, null or `{}` to clear, omit for no change.

        '
      example:
        data:
          amount:
            $gte: 100
          customer:
            tier: premium
    Attempt:
      type: object
      description: An attempt represents a single delivery attempt of an event to a destination.
      properties:
        id:
          type: string
          description: Unique identifier for this attempt.
          example: atm_123
        tenant_id:
          type: string
          description: The tenant this attempt belongs to.
          example: tnt_123
        status:
          type: string
          enum:
          - success
          - failed
          description: The attempt status.
          example: success
        time:
          type: string
          format: date-time
          description: Time the attempt was made.
          example: '2024-01-01T00:00:05Z'
        code:
          type: string
          description: Response status code or error code.
          example: '200'
        response_data:
          type: object
          nullable: true
          description: Response data from the attempt. Only included when include=response_data.
          additionalProperties: true
          example:
            status_code: 200
            body: '{"status":"ok"}'
            headers:
              content-type: application/json
        attempt_number:
          type: integer
          description: The attempt number (1 for first attempt, 2+ for retries).
          example: 1
        manual:
          type: boolean
          description: Whether this attempt was manually triggered (e.g., a retry initiated by a user).
          example: false
        latency_ms:
          type: integer
          nullable: true
          description: Time in milliseconds from sending the attempt to receiving the destination's response (or the error), measured around the provider's publish call. Null for attempts that never reached the provider and for attempts recorded before latency was tracked.
          example: 212
        event_id:
          type: string
          description: The ID of the associated event.
          example: evt_123
        destination_id:
          type: string
          description: The destination ID this attempt was sent to.
          example: des_456
        event:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/EventFull'
          - $ref: '#/components/schemas/EventSummary'
          description: The associated event object. Only present when include=event or include=event.data.
        destination:
          nullable: true
          $ref: '#/components/schemas/AttemptDestination'
          description: The destination object, without credentials. Only present when include=destination.
    AttemptPaginatedResult:
      type: object
      description: Paginated list of attempts.
      properties:
        pagination:
          $ref: '#/components/schemas/SeekPagination'
        models:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
          description: Array of attempt objects.
    AttemptTrigger:
      type:
      - string
      - 'null'
      enum:
      - INITIAL
      - MANUAL
      - BULK_RETRY
      - UNPAUSE
      - AUTOMATIC
      description: How the attempt was triggered
    APIErrorResponse_2:
      type: object
      properties:
        code:
          type: string
          description: Error code
        status:
          type: number
          format: float
          description: Status code
        message:
          type: string
          description: Error description
        data:
          type:
          - object
          - 'null'
          properties: {}
      required:
      - code
      - status
      - message
      additionalProperties: false
      description: Error response model
    AttemptErrorCodes:
      type: string
      enum:
      - BAD_RESPONSE
      - CANCELLED
      - TIMEOUT
      - NOT_FOUND
      - CANCELLED_PAST_RETENTION
      - CONNECTION_REFUSED
      - CONNECTION_RESET
      - MISSING_URL
      - CLI
      - CLI_UNAVAILABLE
      - SELF_SIGNED_CERT
      - ERR_TLS_CERT_ALTNAME_INVALID
      - ERR_SSL_WRONG_VERSION_NUMBER
      - NETWORK_ERROR
      - NETWORK_REQUEST_CANCELED
      - NETWORK_UNREACHABLE
      - TOO_MANY_REDIRECTS
      - INVALID_CHARACTER
      - INVALID_URL
      - SSL_ERROR_CA_UNKNOWN
      - DATA_ARCHIVED
      - SSL_CERT_EXPIRED
      - BULK_RETRY_CANCELLED
      - DNS_LOOKUP_FAILED
      - HOST_UNREACHABLE
      - INTERNAL_ERROR
      - PROTOCOL_ERROR
      - PAYLOAD_MISSING
      - UNABLE_TO_GET_ISSUER_CERT
      - SOCKET_CLOSED
      - OAUTH2_HANDSHAKE_FAILED
      - Z_DATA_ERROR
      - UNKNOWN
      description: Error code of the delivery attempt
    EventAttempt:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          description: Attempt ID
        team_id:
          type: string
          description: ID of the project
        event_id:
          type: string
          description: Event ID
        destination_id:
          type: string
          description: Destination ID
        response_status:
          type:
          - integer
          - 'null'
          description: Attempt's HTTP response code
        attempt_number:
          type:
          - integer
          - 'null'
          description: Sequential number of attempts (up to and including this one) made for the associated event
        trigger:
          $ref: '#/components/schemas/AttemptTrigger'
        error_code:
          $ref: '#/components/schemas/AttemptErrorCodes'
        body:
          anyOf:
          - type:
            - object
            - 'null'
            properties: {}
            description: Response body from the destination
          - type:
            - string
            - 'null'
            description: Response body from the destination
        requested_url:
          type:
          - string
          - 'null'
          description: URL of the destination where delivery was attempted
        http_method:
          type:
          - string
          - 'null'
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          description: HTTP method used to deliver the attempt
        bulk_retry_id:
          type:
          - string
          - 'null'
          description: ID of associated bulk retry
        status:
          $ref: '#/components/schemas/AttemptStatus'
        successful_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date the attempt was successful
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date the attempt was delivered
        responded_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date the destination responded to this attempt
        delivery_latency:
          type:
          - integer
          - 'null'
          description: Time elapsed between attempt initiation and final delivery (in ms)
        response_latency:
          type:
          - integer
          - 'null'
          description: Time elapsed between attempt initiation and a response from the destination (in ms)
        updated_at:
          type: string
