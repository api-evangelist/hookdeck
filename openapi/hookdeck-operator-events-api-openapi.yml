          example:
          - alert.destination.disabled
          - alert.attempt.exhausted_retries
        config:
          type: object
          additionalProperties: true
          description: 'Config fields to change for the destination''s type. Merge-patch semantics: fields that are not sent keep their value.'
          example:
            url: https://alerts.acme.com/outpost
        credentials:
          type: object
          additionalProperties: true
          description: 'Credential fields to change for the destination''s type. Merge-patch semantics: fields that are not sent keep their value. For `webhook`, set `secret` to replace the signing secret, or send `rotate_secret: true` to have Outpost generate a new one and keep the current one valid as `previous_secret`.'
          example:
            rotate_secret: true
    DestinationHookdeck:
      type: object
      x-docs-type: Hookdeck Event Gateway
      required:
      - id
      - type
      - topics
      - credentials
      - created_at
      - disabled_at
      properties:
        id:
          type: string
          description: Control plane generated ID or user provided ID for the destination.
          example: des_12345
        type:
          type: string
          description: Type of the destination.
          enum:
          - hookdeck
          example: hookdeck
        topics:
          $ref: '#/components/schemas/Topics'
        filter:
          $ref: '#/components/schemas/Filter'
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: ISO Date when the destination was disabled, or null if enabled.
          example: null
        created_at:
          type: string
          format: date-time
          description: ISO Date when the destination was created.
          example: '2024-01-01T00:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO Date when the destination was last updated.
          example: '2024-01-01T00:00:00Z'
        config: {}
        credentials:
          $ref: '#/components/schemas/HookdeckCredentials'
        delivery_metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Static key-value pairs merged into event metadata on every attempt.
          example:
            app-id: my-app
            region: us-east-1
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary contextual information stored with the destination.
          example:
            internal-id: '123'
            team: platform
        target:
          type: string
          description: A human-readable representation of the destination target (Hookdeck). Read-only.
          readOnly: true
          example: Hookdeck
        target_url:
          type: string
          format: url
          nullable: true
          description: A URL link to the destination target (e.g., Hookdeck dashboard). Read-only.
          readOnly: true
          example: https://dashboard.hookdeck.com/sources/src_xxxyyyzzz
      example:
        id: des_hkd_abc
        type: hookdeck
        topics:
        - '*'
        disabled_at: null
        created_at: '2024-04-01T10:00:00Z'
        updated_at: '2024-04-01T10:00:00Z'
        config: {}
        credentials:
          token: hd_token_...
