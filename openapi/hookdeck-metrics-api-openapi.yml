openapi: 3.2.0
info:
  title: Hookdeck Metrics API
  version: '1.0'
  description: 'Operations tagged Metrics across 2 of this provider''s published API definitions: hookdeck-openapi.yml, hookdeck-metrics-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.outpost.hookdeck.com/2025-07-01
  description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
- url: http://localhost:3333/api/v1
  description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
- url: https://api.hookdeck.com/2025-07-01
  description: Production API
tags:
- name: Metrics
  description: Aggregated metrics for events and delivery attempts. Supports time bucketing, dimensional grouping, and filtering.
paths:
  /metrics/events:
    get:
      tags:
      - Metrics
      summary: Get Event Metrics
      description: 'Returns aggregated event publish metrics. Supports time bucketing via granularity,

        dimensional grouping, and filtering.


        **Measures:** `count`, `rate`


        **Dimensions:** `tenant_id` (admin-only), `topic`, `destination_id`


        **Filters:** `tenant_id` (admin-only), `topic`, `destination_id`'
      operationId: getEventMetrics
      parameters:
      - name: time
        in: query
        required: true
        style: deepObject
        explode: true
        schema:
          type: object
          required:
          - start
          - end
          properties:
            start:
              type: string
              format: date-time
              description: Start of the time range (inclusive). ISO 8601 timestamp.
              example: '2026-03-02T00:00:00Z'
            end:
              type: string
              format: date-time
              description: End of the time range (exclusive). ISO 8601 timestamp.
              example: '2026-03-03T00:00:00Z'
        description: Time range for the metrics query.
      - name: granularity
        in: query
        required: false
        schema:
          type: string
        description: 'Time bucketing granularity. Pattern: `<number><unit>`.

          Units: `s` (1-60), `m` (1-60), `h` (1-24), `d` (1-31), `w` (1-4), `M` (1-12).

          When omitted, returns a single aggregate row per dimension combination.

          '
        example: 1h
      - name: measures
        in: query
        required: true
        schema:
          oneOf:
          - type: string
            enum:
            - count
            - rate
          - type: array
            items:
              type: string
              enum:
              - count
              - rate
        description: Measures to compute. At least one required. `rate` is events/second throughput. Use bracket notation for multiple values (e.g., `measures[0]=count`).
        example:
        - count
      - name: dimensions
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            enum:
            - tenant_id
            - topic
            - destination_id
          - type: array
            items:
              type: string
              enum:
              - tenant_id
              - topic
              - destination_id
        description: Dimensions to group results by. Use bracket notation for multiple values (e.g., `dimensions[0]=topic&dimensions[1]=destination_id`).
      - name: filters[topic]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by topic name(s). Use bracket notation for multiple values (e.g., `filters[topic][0]=user.created&filters[topic][1]=user.updated`).
      - name: filters[destination_id]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by destination ID(s). Use bracket notation for multiple values (e.g., `filters[destination_id][0]=d1&filters[destination_id][1]=d2`).
      - name: filters[tenant_id]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by tenant ID(s). Admin-only — rejected with 403 for JWT callers. Use bracket notation for multiple values (e.g., `filters[tenant_id][0]=t1&filters[tenant_id][1]=t2`).
      responses:
        '200':
          description: Aggregated event metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              examples:
                HourlyEventCount:
                  value:
                    data:
                    - time_bucket: '2026-03-02T14:00:00Z'
                      dimensions:
                        topic: user.created
                      metrics:
                        count: 1423
                    - time_bucket: '2026-03-02T15:00:00Z'
                      dimensions:
                        topic: user.created
                      metrics:
                        count: 1891
                    metadata:
                      granularity: 1h
                      query_time_ms: 42
                      row_count: 2
                      row_limit: 100000
                      truncated: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: JWT caller attempted to use admin-only dimension or filter (tenant_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /metrics/attempts:
    get:
      tags:
      - Metrics
      summary: Get Attempt Metrics
      description: 'Returns aggregated delivery attempt metrics. Supports time bucketing via granularity,

        dimensional grouping, and filtering.


        **Measures:** `count`, `successful_count`, `failed_count`, `error_rate`,

        `first_attempt_count`, `retry_count`, `manual_retry_count`, `avg_attempt_number`,

        `rate`, `successful_rate`, `failed_rate`, `avg_latency`, `p50_latency`, `p95_latency`, `p99_latency`


        Latency measures are in milliseconds and computed over attempts that recorded a

        latency (see `latency_ms` on the attempt object). They are `null` for a bucket

        with no such attempts, rather than `0`.


        **Dimensions:** `tenant_id` (admin-only), `destination_id`, `destination_type`, `topic`, `status`, `code`, `manual`, `attempt_number`


        **Filters:** `tenant_id` (admin-only), `destination_id`, `destination_type`, `topic`, `status`, `code`, `manual`, `attempt_number`'
      operationId: getAttemptMetrics
      parameters:
      - name: time
        in: query
        required: true
        style: deepObject
        explode: true
        schema:
          type: object
          required:
          - start
          - end
          properties:
            start:
              type: string
              format: date-time
              description: Start of the time range (inclusive). ISO 8601 timestamp.
              example: '2026-03-02T00:00:00Z'
            end:
              type: string
              format: date-time
              description: End of the time range (exclusive). ISO 8601 timestamp.
              example: '2026-03-03T00:00:00Z'
        description: Time range for the metrics query.
      - name: granularity
        in: query
        required: false
        schema:
          type: string
        description: 'Time bucketing granularity. Pattern: `<number><unit>`.

          Units: `s` (1-60), `m` (1-60), `h` (1-24), `d` (1-31), `w` (1-4), `M` (1-12).

          When omitted, returns a single aggregate row per dimension combination.

          '
        example: 1h
      - name: measures
        in: query
        required: true
        schema:
          oneOf:
          - type: string
            enum:
            - count
            - successful_count
            - failed_count
            - error_rate
            - first_attempt_count
            - retry_count
            - manual_retry_count
            - avg_attempt_number
            - rate
            - successful_rate
            - failed_rate
            - avg_latency
            - p50_latency
            - p95_latency
            - p99_latency
          - type: array
            items:
              type: string
              enum:
              - count
              - successful_count
              - failed_count
              - error_rate
              - first_attempt_count
              - retry_count
              - manual_retry_count
              - avg_attempt_number
              - rate
              - successful_rate
              - failed_rate
              - avg_latency
              - p50_latency
              - p95_latency
              - p99_latency
        description: Measures to compute. At least one required. Rate measures (`rate`, `successful_rate`, `failed_rate`) are throughput in events/second. Latency measures (`avg_latency`, `p50_latency`, `p95_latency`, `p99_latency`) are destination response times in milliseconds, `null` when no attempt in the bucket recorded a latency. Use bracket notation for multiple values (e.g., `measures[0]=count&measures[1]=error_rate`).
        example:
        - count
        - error_rate
        - p95_latency
      - name: dimensions
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            enum:
            - tenant_id
            - destination_id
            - destination_type
            - topic
            - status
            - code
            - manual
            - attempt_number
          - type: array
            items:
              type: string
              enum:
              - tenant_id
              - destination_id
              - destination_type
              - topic
              - status
              - code
              - manual
              - attempt_number
        description: Dimensions to group results by. Use bracket notation for multiple values (e.g., `dimensions[0]=status&dimensions[1]=destination_id`).
      - name: filters[destination_id]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by destination ID(s). Use bracket notation for multiple values (e.g., `filters[destination_id][0]=d1&filters[destination_id][1]=d2`).
      - name: filters[destination_type]
        in: query
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/DestinationType'
          - type: array
            items:
              $ref: '#/components/schemas/DestinationType'
        description: Filter by destination type(s). Use bracket notation for multiple values (e.g., `filters[destination_type][0]=webhook&filters[destination_type][1]=aws_sqs`).
      - name: filters[topic]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by topic name(s). Use bracket notation for multiple values (e.g., `filters[topic][0]=user.created&filters[topic][1]=user.updated`).
      - name: filters[status]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            enum:
            - success
            - failed
          - type: array
            items:
              type: string
              enum:
              - success
              - failed
        description: Filter by attempt status(es). Use bracket notation for multiple values (e.g., `filters[status][0]=success&filters[status][1]=failed`).
      - name: filters[code]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by HTTP status code(s). Use bracket notation for multiple values (e.g., `filters[code][0]=200&filters[code][1]=500`).
      - name: filters[manual]
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter by manual retry flag.
      - name: filters[attempt_number]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by attempt number(s). Use bracket notation for multiple values (e.g., `filters[attempt_number][0]=1&filters[attempt_number][1]=2`).
      - name: filters[tenant_id]
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by tenant ID(s). Admin-only — rejected with 403 for JWT callers. Use bracket notation for multiple values (e.g., `filters[tenant_id][0]=t1&filters[tenant_id][1]=t2`).
      responses:
        '200':
          description: Aggregated attempt metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              examples:
                DailyAttemptCounts:
                  value:
                    data:
                    - time_bucket: '2026-03-02T00:00:00Z'
                      dimensions:
                        destination_id: dest_abc
                      metrics:
                        count: 1423
                        successful_count: 1393
                        failed_count: 30
                        error_rate: 0.0211
                        avg_latency: 212.4
                        p95_latency: 810
                    metadata:
                      granularity: 1d
                      query_time_ms: 38
                      row_count: 1
                      row_limit: 100000
                      truncated: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: JWT caller attempted to use admin-only dimension or filter (tenant_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /metrics/requests:
    get:
      operationId: queryRequestMetrics
      summary: Query request metrics
      description: Query aggregated request metrics with time-based grouping and filtering
      tags:
      - Metrics
      responses:
        '200':
          description: Request metrics results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse_2'
      parameters:
      - in: query
        name: date_range
        schema:
          type: object
          properties:
            start:
              type: string
              format: date-time
              description: Start of the time range in ISO 8601 format
            end:
              type: string
              format: date-time
              description: End of the time range in ISO 8601 format
          required:
          - start
          - end
          additionalProperties: false
      - in: query
        name: granularity
        schema:
          type:
          - string
          - 'null'
          pattern: ^(\d+)(s|m|h|d|w|M)$
          description: 'Time bucket granularity. Format: <number><unit> where unit is s (seconds 1-60), m (minutes 1-60), h (hours 1-24), d (days 1-31), w (weeks 1-4), M (months 1-12). Examples: 1s, 5m, 1h, 1d'
      - in: query
        name: filters
        schema:
          type: object
          properties:
            source_id:
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
                minItems: 1
              description: Filter by source ID (single value or array)
            rejection_cause:
              anyOf:
              - type: string
                enum:
                - SOURCE_DISABLED
                - NO_CONNECTION
                - VERIFICATION_FAILED
                - UNSUPPORTED_HTTP_METHOD
                - UNSUPPORTED_CONTENT_TYPE
                - UNPARSABLE_JSON
                - PAYLOAD_TOO_LARGE
                - INGESTION_FATAL
                - UNKNOWN
              - type: array
                items:
                  type: string
                  enum:
                  - SOURCE_DISABLED
                  - NO_CONNECTION
                  - VERIFICATION_FAILED
                  - UNSUPPORTED_HTTP_METHOD
                  - UNSUPPORTED_CONTENT_TYPE
                  - UNPARSABLE_JSON
                  - PAYLOAD_TOO_LARGE
                  - INGESTION_FATAL
                  - UNKNOWN
                minItems: 1
              description: Filter by rejection cause (single value or array)
            status:
              anyOf:
              - type: string
                enum:
                - ACCEPTED
                - REJECTED
              - type: array
                items:
                  type: string
                  enum:
                  - ACCEPTED
                  - REJECTED
                minItems: 1
              description: Filter by request status (single value or array)
            bulk_retry_ids:
              type: array
              items:
                type: string
              description: Filter by bulk retry operation IDs
            events_count:
              type: object
              properties:
                min:
                  type: integer
                  minimum: 0
                  description: Minimum number of events
                max:
                  type: integer
                  minimum: 0
                  description: Maximum number of events
              additionalProperties: false
              description: Filter by number of events created (range with min/max)
            ignored_count:
              type: object
              properties:
                min:
                  type: integer
                  minimum: 0
                  description: Minimum number of ignored
                max:
                  type: integer
                  minimum: 0
                  description: Maximum number of ignored
              additionalProperties: false
              description: Filter by number of ignored connections (range with min/max)
          additionalProperties: false
      - in: query
        name: measures
        schema:
          type: array
          items:
            type: string
            enum:
            - count
            - accepted_count
            - rejected_count
            - discarded_count
            - avg_events_per_request
            - avg_ignored_per_request
          minItems: 1
          description: Metrics to calculate
      - in: query
        name: dimensions
        schema:
          type: array
          items:
            type: string
            enum:
            - source_id
            - rejection_cause
            - status
            - bulk_retry_ids
            - events_count
            - ignored_count
          description: Dimensions to group by
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://api.hookdeck.com/2025-07-01
      description: Production API
  /metrics/events-by-issue:
    get:
      operationId: queryEventsByIssueMetrics
      summary: Query event metrics grouped by individual issue
      description: Returns metrics for events broken down by individual issue IDs. Uses arrayJoin to create one row per issue per event, enabling per-issue analytics. Useful for tracking which issues affect the most events over time.
      tags:
      - Metrics
      responses:
        '200':
          description: Events by issue metrics results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse_2'
      parameters:
      - in: query
        name: date_range
        schema:
          type: object
          properties:
            start:
              type: string
              format: date-time
              description: Start of the time range in ISO 8601 format
            end:
              type: string
              format: date-time
              description: End of the time range in ISO 8601 format
          required:
          - start
          - end
          additionalProperties: false
      - in: query
        name: granularity
        schema:
          type:
          - string
          - 'null'
          pattern: ^(\d+)(s|m|h|d|w|M)$
          description: 'Time bucket granularity. Format: <number><unit> where unit is s (seconds 1-60), m (minutes 1-60), h (hours 1-24), d (days 1-31), w (weeks 1-4), M (months 1-12). Examples: 1s, 5m, 1h, 1d'
      - in: query
        name: filters
        schema:
          type: object
          properties:
            issue_id:
              anyOf:
              - type: string
              - type: array
                items:
                  type: string
                minItems: 1
              description: Filter by issue ID(s) - required. Single ID or array of IDs
            source_id:
              type: string
              description: Filter by source ID
            destination_id:
              type: string
              description: Filter by destination ID
            webhook_id:
              type: string
              description: Filter by webhook/connection ID
          required:
          - issue_id
          additionalProperties: false
      - in: query
        name: measures
        schema:
          type: array
          items:
            type: string
            enum:
            - count
          minItems: 1
          description: Metrics to calculate
      - in: query
        name: dimensions
        schema:
          type: array
          items:
            type: string
            enum:
            - issue_id
            - source_id
            - destination_id
            - webhook_id
          description: Dimensions to group by
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://api.hookdeck.com/2025-07-01
      description: Production API
  /metrics/queue-depth:
    get:
      operationId: queryQueueDepthMetrics
      summary: Query queue depth metrics
      description: Query queue depth metrics for destinations (pending events count and age)
      tags:
      - Metrics
      responses:
        '200':
          description: Queue depth metrics results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse_2'
      parameters:
      - in: query
        name: date_range
        schema:
          type: object
          properties:
            start:
              type: string
              format: date-time
              description: Start of the time range in ISO 8601 format
            end:
              type: string
              format: date-time
              description: End of the time range in ISO 8601 format
          required:
          - start
          - end
          additionalProperties: false
      - in: query
        name: granularity
        schema:
          type:
          - string
          - 'null'
          pattern: ^(\d+)(s|m|h|d|w|M)$
          description: 'Time bucket granularity. Format: <number><unit> where unit is s (seconds 1-60), m (minutes 1-60), h (hours 1-24), d (days 1-31), w (weeks 1-4), M (months 1-12). Examples: 1s, 5m, 1h, 1d'
      - in: query
        name: filters
        schema:
          type: object
          properties:
            destination_id:
              type: string
              description: Filter by destination ID
          additionalProperties: false
      - in: query
        name: measures
        schema:
          type: array
          items:
            type: string
            enum:
            - max_depth
            - max_age
          minItems: 1
          description: Metrics to calculate
      - in: query
        name: dimensions
        schema:
          type: array
          items:
            type: string
            enum:
            - destination_id
          description: Dimensions to group by
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://api.hookdeck.com/2025-07-01
      description: Production API
  /metrics/transformations:
    get:
      operationId: queryTransformationMetrics
      summary: Query transformation execution metrics
      description: Query aggregated transformation execution metrics with time-based grouping and filtering
      tags:
      - Metrics
      responses:
        '200':
          description: Transformation metrics results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse_2'
      parameters:
      - in: query
        name: date_range
        schema:
          type: object
          properties:
            start:
              type: string
              format: date-time
              description: Start of the time range in ISO 8601 format
            end:
              type: string
              format: date-time
              description: End of the time range in ISO 8601 format
          required:
          - start
          - end
          additionalProperties: false
      - in: query
        name: granularity
        schema:
          type:
          - string
          - 'null'
          pattern: ^(\d+)(s|m|h|d|w|M)$
          description: 'Time bucket granularity. Format: <number><unit> where unit is s (seconds 1-60), m (minutes 1-60), h (hours 1-24), d (days 1-31), w (weeks 1-4), M (months 1-12). Examples: 1s, 5m, 1h, 1d'
      - in: query
        name: filters
        schema:
          type: object
          properties:
            transformation_id:
              type: string
              description: Filter by transformation ID
            webhook_id:
              type: string
              description: Filter by connection ID
            log_level:
              type: string
              enum:
              - error
              - warn
              - info
              - debug
              - ''
              description: Filter by log level
            issue_id:
              type: string
              description: Filter by issue ID
          additionalProperties: false
      - in: query
        name: measures
        schema:
          type: array
          items:
            type: string
            enum:
            - count
            - successful_count
            - failed_count
            - error_rate
            - error_count
            - warn_count
            - info_count
            - debug_count
          minItems: 1
          description: Metrics to calculate
      - in: query
        name: dimensions
        schema:
          type: array
          items:
            type: string
            enum:
            - transformation_id
            - webhook_id
            - log_level
            - issue_id
          description: Dimensions to group by
      security:
      - bearerAuth: []
      - basicAuth: []
    servers:
    - url: https://api.hookdeck.com/2025-07-01
      description: Production API
  /metrics/events-pending-timeseries:
    get:
      operationId: queryEventsPendingTimeseriesMetrics
      summary: Query events pending timeseries metrics
      description: Query aggregated events pending timeseries metrics with time-based grouping and filtering
      tags:
      - Metrics
      responses:
        '200':
          description: Events pending timeseries metrics results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse_2'
      parameters:
      - in: query
        name: date_range
        schema:
          type: object
          properties:
