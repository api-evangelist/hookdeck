            oneOf:
            - type: string
            - type: 'null'
          nullable: true
          description: 'Static key-value pairs merged into event metadata on every attempt. Uses JSON merge-patch semantics (RFC 7396): send keys to add/update, null values to delete keys, null for entire field to clear all. Omit or send {} for no change.'
          example:
            app-id: my-app
            region: us-east-1
        metadata:
          type: object
