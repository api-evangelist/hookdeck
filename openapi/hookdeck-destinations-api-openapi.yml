      type: object
      description: Partial Webhook credentials for PATCH updates (RFC 7396 merge-patch).
      properties:
        secret:
          type: string
          description: New secret (only allowed for admin).
        previous_secret:
          type: string
          description: Previous secret for rotation (only allowed for admin).
