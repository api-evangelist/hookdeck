                    updated_at: '2024-02-15T10:00:00Z'
                    config:
                      url: https://my-service.com/webhook/handler
                    credentials:
                      secret: whsec_abc123def456
                      previous_secret: whsec_prev789xyz012
                      previous_secret_invalid_at: '2024-02-16T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /tenants/{tenant_id}/destinations/{destination_id}/attempts:
    parameters:
    - name: tenant_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the tenant. Required when using AdminApiKey authentication.
    - name: destination_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the destination.
    get:
      tags:
      - Destinations
      summary: List Destination Attempts
      description: 'Retrieves a paginated list of attempts scoped to a specific destination.


        Returns `404` if the destination does not exist or has been deleted. The attempts of a deleted destination remain available from `GET /attempts?destination_id=`.'
      operationId: listTenantDestinationAttempts
      parameters:
      - name: event_id
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter attempts by event ID(s). Use bracket notation for multiple values (e.g., `event_id[0]=e1&event_id[1]=e2`).
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - success
          - failed
        description: Filter attempts by status.
      - name: topic
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter attempts by event topic(s). Use bracket notation for multiple values (e.g., `topic[0]=user.created&topic[1]=user.updated`).
      - name: time
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          $ref: '#/components/schemas/Operator'
        description: Filter attempts by event time range using comparison operators.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
        description: Number of items per page (1-1000, default 100). A value outside this range, or one that is not an integer, returns a 400.
      - name: next
        in: query
        required: false
        schema:
          type: string
        description: Cursor for the next page of results, from `pagination.next` of a previous response. Mutually exclusive with `prev`. A cursor that cannot be read returns a 400.
      - name: prev
        in: query
        required: false
        schema:
          type: string
        description: Cursor for the previous page of results, from `pagination.prev` of a previous response. Mutually exclusive with `next`. A cursor that cannot be read returns a 400.
      - name: include
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: 'Fields to include in the response. Use bracket notation for multiple values (e.g., `include[0]=event&include[1]=response_data`).

          - `event`: Include event summary (id, topic, time, eligible_for_retry, metadata)

          - `event.data`: Include full event with payload data

          - `response_data`: Include response body and headers

          - `destination`: Include the destination object, without credentials

          '
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - time
          default: time
        description: Field to sort by.
      - name: dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction.
      responses:
        '200':
          description: A paginated list of attempts for the destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPaginatedResult'
              examples:
                DestinationAttemptsListExample:
                  value:
                    pagination:
                      order_by: time
                      dir: desc
                      limit: 100
                      next: MTcwNDA2NzIwMA==
                      prev: null
                    models:
                    - id: atm_123
                      status: success
                      time: '2024-01-01T00:00:05Z'
                      code: '200'
                      attempt_number: 1
                      latency_ms: 212
                      event_id: evt_123
                      destination_id: des_456
                    - id: atm_124
                      status: failed
                      time: '2024-01-02T10:00:01Z'
                      code: '503'
                      attempt_number: 2
                      latency_ms: 1502
                      event_id: evt_789
                      destination_id: des_456
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /tenants/{tenant_id}/destinations/{destination_id}/attempts/{attempt_id}:
    parameters:
    - name: tenant_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the tenant. Required when using AdminApiKey authentication.
    - name: destination_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the destination.
    - name: attempt_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the attempt.
    get:
      tags:
      - Destinations
      summary: Get Destination Attempt
      description: 'Retrieves details for a specific attempt scoped to a destination.


        Returns `404` if the destination does not exist or has been deleted, or if the destination has no attempt with this ID. An attempt of a deleted destination remains available from `GET /attempts/{attempt_id}`.'
      operationId: getTenantDestinationAttempt
      parameters:
      - name: include
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: 'Fields to include in the response. Use bracket notation for multiple values (e.g., `include[0]=event&include[1]=response_data`).

          - `event`: Include event summary

          - `event.data`: Include full event with payload data

          - `response_data`: Include response body and headers

          - `destination`: Include the destination object, without credentials

          '
      responses:
        '200':
          description: Attempt details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
              examples:
                DestinationAttemptExample:
                  value:
                    id: atm_123
                    status: success
                    time: '2024-01-01T00:00:05Z'
                    code: '200'
                    attempt_number: 1
                    latency_ms: 212
                    event_id: evt_123
                    destination_id: des_456
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /destinations:
    get:
      operationId: getDestinations
      summary: Retrieve destinations
      description: This endpoint lists destinations, or a subset of destinations.
      tags:
      - Destinations
      responses:
        '200':
          description: List of destinations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationPaginatedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse_2'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse_2'
      parameters:
      - in: query
        name: id
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: array
            items:
              type: string
              maxLength: 255
          description: Filter by destination IDs
      - in: query
        name: name
        schema:
          anyOf:
          - type: string
            pattern: ^[A-z0-9-_]+$
            maxLength: 155
          - $ref: '#/components/schemas/Operators'
          - type: array
            items:
              type: string
              pattern: ^[A-z0-9-_]+$
              maxLength: 155
          description: The destination name
      - in: query
        name: type
        schema:
          anyOf:
          - type: string
            enum:
            - HTTP
            - CLI
            - MOCK_API
          - type: array
            items:
              type: string
              enum:
              - HTTP
              - CLI
              - MOCK_API
          description: Filter by destination type
      - in: query
        name: disabled
        schema:
          type: boolean
          description: Include disabled resources in the response
      - in: query
        name: disabled_at
        schema:
          anyOf:
          - type:
            - string
            - 'null'
            format: date-time
          - $ref: '#/components/schemas/Operators'
          description: Date the destination was disabled
      - in: query
        name: order_by
        schema:
          type: string
          maxLength: 255
          enum:
          - name
          - created_at
          - updated_at
          description: Sort key
      - in: query
        name: dir
        schema:
          type: string
          enum:
          - asc
