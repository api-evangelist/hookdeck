    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
