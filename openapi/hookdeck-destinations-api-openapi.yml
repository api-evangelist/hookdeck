openapi: 3.2.0
info:
  title: Hookdeck Destinations API
  version: '1.0'
  description: 'Operations tagged Destinations across 2 of this provider''s published API definitions: hookdeck-openapi.yml, hookdeck-destinations-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.outpost.hookdeck.com/2025-07-01
  description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
- url: http://localhost:3333/api/v1
  description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
- url: https://api.hookdeck.com/2025-07-01
  description: Production API
tags:
- name: Destinations
  description: 'Destinations are the endpoints where events are sent. Each destination is associated with a tenant and can be configured to receive specific event topics.


    The `topics` array can contain either a list of topics or a wildcard `*` implying that all topics are supported. If you do not wish to implement topics for your application, you set all destination topics to `*`.


    By default all destination `credentials` are obfuscated and the values cannot be read. This does not apply to the `webhook` type destination secret and each destination can expose their own obfuscation logic.'
paths:
  /tenants/{tenant_id}/destinations:
    description: 'Manage destinations for a specific tenant. Destinations determine where events are sent.

      The structure of `config` and `credentials` depends on the destination `type`.

      '
    parameters:
    - name: tenant_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the tenant. Required when using AdminApiKey authentication.
    get:
      tags:
      - Destinations
      summary: List Destinations
      description: Return a list of the destinations for the tenant. The endpoint is not paged.
      operationId: listTenantDestinations
      parameters:
      - name: type
        in: query
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/DestinationType'
          - type: array
            items:
              $ref: '#/components/schemas/DestinationType'
        description: Filter destinations by type(s). Use bracket notation for multiple values (e.g., `type[0]=webhook&type[1]=aws_sqs`).
      - name: topics
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter destinations by supported topic(s). Use bracket notation for multiple values (e.g., `topics[0]=user.created&topics[1]=user.deleted`).
      responses:
        '200':
          description: A list of destinations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
              examples:
                DestinationsListExample:
                  value:
                  - id: des_webhook_123
                    type: webhook
                    topics:
                    - user.created
                    - order.shipped
                    disabled_at: null
                    created_at: '2024-02-15T10:00:00Z'
                    updated_at: '2024-02-15T10:00:00Z'
                    config:
                      url: https://my-service.com/webhook/handler
                    credentials:
                      secret: whsec_abc123def456
                      previous_secret: whsec_prev789xyz012
                      previous_secret_invalid_at: '2024-02-16T10:00:00Z'
                  - id: des_sqs_456
                    type: aws_sqs
                    topics:
                    - '*'
                    disabled_at: '2024-03-01T12:00:00Z'
                    created_at: '2024-02-20T11:30:00Z'
                    updated_at: '2024-02-20T11:30:00Z'
                    config:
                      queue_url: https://sqs.us-west-2.amazonaws.com/123456789012/my-app-queue
                      endpoint: https://sqs.us-west-2.amazonaws.com
                    credentials:
                      key: AKIAIOSFODNN7EXAMPLE
                      secret: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
                  - id: des_s3_789
                    type: aws_s3
                    topics:
                    - '*'
                    disabled_at: null
                    created_at: '2024-03-20T12:00:00Z'
                    updated_at: '2024-03-20T12:00:00Z'
                    config:
                      bucket: my-bucket
                      region: us-east-1
                    credentials:
                      key: AKIAIOSFODNN7EXAMPLE
                      secret: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    post:
      tags:
      - Destinations
      summary: Create Destination
      description: Creates a new destination for the tenant. The request body structure depends on the `type`.
      operationId: createTenantDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreate'
            examples:
              WebhookCreateExample:
                summary: Create a webhook destination
                value:
                  type: webhook
                  topics:
                  - user.created
                  - order.shipped
                  config:
                    url: https://my-service.com/webhook/handler
      responses:
        '201':
          description: Destination created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
              examples:
                WebhookCreatedExample:
                  summary: Webhook destination created
                  value:
                    id: des_webhook_123
                    type: webhook
                    topics:
                    - user.created
                    - order.shipped
                    disabled_at: null
                    created_at: '2024-02-15T10:00:00Z'
                    updated_at: '2024-02-15T10:00:00Z'
                    config:
                      url: https://my-service.com/webhook/handler
                    credentials:
                      secret: whsec_abc123def456
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /tenants/{tenant_id}/destinations/{destination_id}:
    parameters:
    - name: tenant_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the tenant. Required when using AdminApiKey authentication.
    - name: destination_id
