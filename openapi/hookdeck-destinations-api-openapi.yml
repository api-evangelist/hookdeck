components:
  schemas:
    AzureServiceBusConfig:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the Azure Service Bus queue or topic to publish messages to.
          example: my-queue-or-topic
    DestinationRabbitMQ:
      type: object
      x-docs-type: RabbitMQ
      required:
      - id
      - type
      - topics
      - config
      - credentials
      - created_at
      - updated_at
      - disabled_at
      properties:
        id:
          type: string
          description: Control plane generated ID or user provided ID for the destination.
          example: des_12345
        type:
          type: string
          description: Type of the destination.
          enum:
          - rabbitmq
          example: rabbitmq
        topics:
          $ref: '#/components/schemas/Topics'
        filter:
          $ref: '#/components/schemas/Filter'
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: ISO Date when the destination was disabled, or null if enabled.
          example: null
        created_at:
          type: string
          format: date-time
          description: ISO Date when the destination was created.
          example: '2024-01-01T00:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO Date when the destination was last updated.
          example: '2024-01-01T00:00:00Z'
        config:
          $ref: '#/components/schemas/RabbitMQConfig'
        credentials:
          $ref: '#/components/schemas/RabbitMQCredentials'
        delivery_metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Static key-value pairs merged into event metadata on every attempt.
          example:
            app-id: my-app
            region: us-east-1
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary contextual information stored with the destination.
          example:
            internal-id: '123'
            team: platform
        target:
          type: string
          description: A human-readable representation of the destination target (RabbitMQ exchange). Read-only.
          readOnly: true
          example: events-exchange
        target_url:
          type: string
          format: url
          nullable: true
          description: A URL link to the destination target (not applicable for RabbitMQ exchange). Read-only.
          readOnly: true
          example: null
      example:
        id: des_rmq_789
        type: rabbitmq
        topics:
        - inventory.updated
        disabled_at: null
        created_at: '2024-01-10T09:00:00Z'
        updated_at: '2024-01-10T09:00:00Z'
        config:
          server_url: amqp.cloudamqp.com:5671
          exchange: events-exchange
          tls: 'true'
        credentials:
          username: app_user
          password: secure_password_123
    AWSEventBridgeConfig:
      type: object
      required:
      - region
      properties:
        event_bus_name:
          type: string
          description: Optional. The name or ARN of the EventBridge event bus. Defaults to the account's default event bus.
          example: my-event-bus
        region:
          type: string
          description: The AWS region where the event bus is located.
          example: us-east-1
        endpoint:
          type: string
          format: url
          description: Optional. Custom AWS endpoint URL (e.g., for LocalStack or VPC endpoints).
          example: https://events.us-east-1.amazonaws.com
    AWSEventBridgeCredentialsUpdate:
      type: object
      description: Partial AWS EventBridge credentials for PATCH updates (RFC 7396 merge-patch).
      properties:
        key:
          type: string
          description: AWS Access Key ID.
        secret:
          type: string
          description: AWS Secret Access Key.
        session:
          type: string
          description: Optional AWS Session Token (for temporary credentials).
    AWSEventBridgeCredentials:
      type: object
      required:
      - key
      - secret
      properties:
        key:
          type: string
          description: AWS Access Key ID.
          example: AKIAIOSFODNN7EXAMPLE
        secret:
          type: string
          description: AWS Secret Access Key.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        session:
          type: string
          description: Optional AWS Session Token (for temporary credentials).
          example: AQoDYXdzEPT//////////wEXAMPLE...
    DestinationAzureServiceBus:
      type: object
      x-docs-type: Azure Service Bus
      required:
      - id
      - type
      - topics
      - config
      - credentials
      - created_at
      - disabled_at
      properties:
        id:
          type: string
          description: Control plane generated ID or user provided ID for the destination.
          example: des_12345
        type:
          type: string
          description: Type of the destination.
          enum:
          - azure_servicebus
          example: azure_servicebus
        topics:
          $ref: '#/components/schemas/Topics'
        filter:
          $ref: '#/components/schemas/Filter'
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: ISO Date when the destination was disabled, or null if enabled.
          example: null
        created_at:
          type: string
          format: date-time
          description: ISO Date when the destination was created.
          example: '2024-01-01T00:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO Date when the destination was last updated.
          example: '2024-01-01T00:00:00Z'
        config:
          $ref: '#/components/schemas/AzureServiceBusConfig'
        credentials:
          $ref: '#/components/schemas/AzureServiceBusCredentials'
        delivery_metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Static key-value pairs merged into event metadata on every attempt.
          example:
            app-id: my-app
            region: us-east-1
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary contextual information stored with the destination.
          example:
            internal-id: '123'
            team: platform
        target:
          type: string
          description: A human-readable representation of the destination target (Azure Service Bus queue/topic name). Read-only.
          readOnly: true
          example: my-queue-or-topic
        target_url:
          type: string
          format: url
          nullable: true
          description: A URL link to the destination target (Azure Portal link to the Service Bus). Read-only.
          readOnly: true
          example: https://portal.azure.com/#@tenant-id/resource/subscriptions/subscription-id/resourceGroups/resource-group/providers/Microsoft.ServiceBus/namespaces/namespace-name/queues/queue-name
      example:
        id: des_azuresb_123
        type: azure_servicebus
        topics:
        - '*'
        disabled_at: null
        created_at: '2024-05-01T10:00:00Z'
        updated_at: '2024-05-01T10:00:00Z'
        config:
          name: my-queue-or-topic
        credentials:
          connection_string: Endpoint=sb://namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=abc123
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    RabbitMQCredentials:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: RabbitMQ username.
          example: guest
        password:
          type: string
          description: RabbitMQ password.
          example: guest
    DestinationUpdateWebhook:
      type: object
      x-docs-type: Webhook
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - webhook
          description: Destination type discriminator. Must equal the existing destination's type — type itself cannot be changed via PATCH.
          example: webhook
        topics:
          $ref: '#/components/schemas/Topics'
        filter:
          $ref: '#/components/schemas/Filter'
        config:
          $ref: '#/components/schemas/WebhookConfigUpdate'
        credentials:
          $ref: '#/components/schemas/WebhookCredentialsUpdate'
        delivery_metadata:
          type: object
