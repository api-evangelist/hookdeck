      description: The ID of the destination.
    get:
      tags:
      - Destinations
      summary: Get Destination
      description: Retrieves details for a specific destination.
      operationId: getTenantDestination
      responses:
        '200':
          description: Destination details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
              examples:
                WebhookGetExample:
                  value:
                    id: des_webhook_123
                    type: webhook
                    topics:
                    - user.created
                    - order.shipped
                    disabled_at: null
                    created_at: '2024-02-15T10:00:00Z'
                    updated_at: '2024-02-15T10:00:00Z'
                    config:
                      url: https://my-service.com/webhook/handler
                    credentials:
                      secret: whsec_abc123def456
                      previous_secret: whsec_prev789xyz012
                      previous_secret_invalid_at: '2024-02-16T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    patch:
      tags:
      - Destinations
      summary: Update Destination
      description: Updates the configuration of an existing destination. The request body structure depends on the destination's `type`. Type itself cannot be updated. May return an OAuth redirect URL for certain types.
      operationId: updateTenantDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationUpdate'
            examples:
              WebhookUpdateExample:
                summary: Update a webhook destination's topics and URL
                value:
                  topics:
                  - user.created
                  config:
                    url: https://my-service.com/webhook/new-handler
      responses:
        '200':
          description: Destination updated successfully or OAuth redirect needed.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Destination'
              examples:
                DestinationUpdatedExample:
                  summary: Webhook destination updated
                  value:
                    id: des_webhook_123
                    type: webhook
                    topics:
                    - user.created
                    disabled_at: null
                    created_at: '2024-02-15T10:00:00Z'
                    updated_at: '2024-02-15T10:00:00Z'
                    config:
                      url: https://my-service.com/webhook/new-handler
                    credentials:
                      secret: whsec_abc123def456
                      previous_secret: whsec_prev789xyz012
                      previous_secret_invalid_at: '2024-02-16T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    delete:
      tags:
      - Destinations
      summary: Delete Destination
      description: Deletes a specific destination.
      operationId: deleteTenantDestination
      responses:
        '200':
          description: Success confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                SuccessExample:
                  value:
                    success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - AdminApiKey: []
      - TenantJwt: []
    servers:
    - url: https://api.outpost.hookdeck.com/2025-07-01
      description: Managed Outpost, hosted by Hookdeck at `api.outpost.hookdeck.com`. The Hookdeck Event Gateway API at `api.hookdeck.com` is a separate API.
    - url: http://localhost:3333/api/v1
      description: Self-hosted Outpost, at its default local address. A deployed instance serves the same paths under its own host.
  /tenants/{tenant_id}/destinations/{destination_id}/enable:
    parameters:
    - name: tenant_id
